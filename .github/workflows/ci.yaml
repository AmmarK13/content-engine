name: CI

on:
  push:
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: temporal
          POSTGRES_PASSWORD: temporal
          POSTGRES_DB: content_engine
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U temporal -d content_engine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: content_engine
      DB_USER: temporal
      DB_PASSWORD: temporal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Create database schema
        env:
          PGPASSWORD: temporal
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

          psql \
            -h localhost \
            -U temporal \
            -d content_engine \
            -f sql/create_manifest_stage_records.sql

      - name: Run tests
        run: uv run pytest tests/ -v

      - name: Run contract linting
        run: uv run python scripts/contract_lint.py

      - name: Check schemas are in sync
        run: |
          uv run python scripts/export_schemas.py
          git diff --exit-code contracts/