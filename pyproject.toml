[project]
name = "content-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "boto3>=1.43.57",
    "jsonschema>=4.26.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "temporalio>=1.30.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services like PostgreSQL, MinIO, or Temporal"
]