[project]
name = "content-engine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.11"
dependencies = [
    "temporalio>=1.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.28.0",
    "psycopg>=3.1.0",
    "pytest>=7.0.0",
    "google-auth>=2.56.2",
    "google-auth-oauthlib>=1.4.0",
    "google-api-python-client>=2.198.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external services like PostgreSQL, MinIO, or Temporal"
]
